<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comics - GameHub</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/comics.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-gamepad"></i>
                <span>GameHub</span>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Inicio</a>
                <a href="videos.html" class="nav-link"><i class="fas fa-play-circle"></i> Videos</a>
                <a href="comics.html" class="nav-link active"><i class="fas fa-book"></i> Comics</a>
                <a href="games.html" class="nav-link"><i class="fas fa-dice"></i> Juegos</a>
                <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Perfil</a>
                <a href="#" class="nav-link login-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </div>
            <div class="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="comics-container">
        <div class="comics-header">
            <h1><i class="fas fa-book"></i> Comics</h1>
            <p>Sumérgete en increíbles historias visuales y aventuras épicas</p>
            
            <div class="comics-controls">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="comicSearch" placeholder="Buscar comics...">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="aventura">Aventura</button>
                    <button class="filter-btn" data-filter="ciencia-ficcion">Ciencia Ficción</button>
                    <button class="filter-btn" data-filter="fantasia">Fantasía</button>
                    <button class="filter-btn" data-filter="superheroes">Superhéroes</button>
                </div>
            </div>
        </div>

        <div class="comics-grid" id="comicsGrid">
            <!-- Los comics se cargarán dinámicamente -->
        </div>

        <div class="load-more">
            <button class="btn btn-secondary" id="loadMoreBtn">
                <i class="fas fa-plus"></i> Cargar Más Comics
            </button>
        </div>
    </div>

    <!-- Modal del Comic -->
    <div class="modal" id="comicModal">
        <div class="modal-content comic-modal">
            <div class="modal-header">
                <h2 id="comicModalTitle">Título del Comic</h2>
                <button class="modal-close" id="comicModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="comic-viewer">
                    <div class="comic-nav">
                        <button class="nav-btn" id="prevPage">
                            <i class="fas fa-chevron-left"></i> Anterior
                        </button>
                        <span class="page-indicator">
                            Página <span id="currentPage">1</span> de <span id="totalPages">1</span>
                        </span>
                        <button class="nav-btn" id="nextPage">
                            Siguiente <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="comic-page">
                        <img id="comicPageImage" src="" alt="Página del comic">
                    </div>
                    <div class="comic-actions">
                        <button class="btn-action" id="comicLikeBtn">
                            <i class="far fa-heart"></i> <span id="comicLikeCount">0</span>
                        </button>
                        <button class="btn-action" id="comicBookmarkBtn">
                            <i class="far fa-bookmark"></i> Guardar
                        </button>
                        <button class="btn-action" id="comicShareBtn">
                            <i class="fas fa-share"></i> Compartir
                        </button>
                    </div>
                </div>
                <div class="comic-info">
                    <h3>Descripción</h3>
                    <p id="comicDescription">Descripción del comic...</p>
                    <div class="comic-meta">
                        <span><i class="fas fa-user"></i> <span id="comicAuthor">Autor</span></span>
                        <span><i class="fas fa-calendar"></i> <span id="comicDate">Fecha</span></span>
                        <span><i class="fas fa-eye"></i> <span id="comicViews">0</span> lecturas</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/comics.js"></script>
</body>
</html>
