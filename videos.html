<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - GameHub</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/videos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-gamepad"></i>
                <span>GameHub</span>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Inicio</a>
                <a href="videos.html" class="nav-link active"><i class="fas fa-play-circle"></i> Videos</a>
                <a href="comics.html" class="nav-link"><i class="fas fa-book"></i> Comics</a>
                <a href="games.html" class="nav-link"><i class="fas fa-dice"></i> Juegos</a>
                <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Perfil</a>
                <a href="#" class="nav-link login-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </div>
            <div class="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="videos-container">
        <div class="videos-header">
            <h1><i class="fas fa-play-circle"></i> Videos</h1>
            <p>Descubre los mejores gameplays, tutoriales y contenido exclusivo</p>
            
            <div class="search-filters">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="videoSearch" placeholder="Buscar videos...">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="minecraft">Minecraft</button>
                    <button class="filter-btn" data-filter="roblox">Roblox</button>
                    <button class="filter-btn" data-filter="tutoriales">Tutoriales</button>
                    <button class="filter-btn" data-filter="gameplays">Gameplays</button>
                </div>
            </div>
        </div>

        <div class="videos-grid" id="videosGrid">
            <!-- Los videos se cargarán dinámicamente -->
        </div>

        <div class="load-more">
            <button class="btn btn-secondary" id="loadMoreBtn">
                <i class="fas fa-plus"></i> Cargar Más Videos
            </button>
        </div>
    </div>

    <!-- Modal para ver video -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Título del Video</h2>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="video-player">
                    <iframe id="videoIframe" width="100%" height="400" 
                            src="" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <div class="video-stats">
                        <span><i class="fas fa-eye"></i> <span id="viewCount">0</span> vistas</span>
                        <span><i class="fas fa-calendar"></i> <span id="uploadDate">Hoy</span></span>
                        <span><i class="fas fa-clock"></i> <span id="videoDuration">0:00</span></span>
                    </div>
                    <div class="video-description">
                        <p id="videoDescription">Descripción del video...</p>
                    </div>
                    <div class="video-actions">
                        <button class="btn-action" id="likeBtn">
                            <i class="far fa-thumbs-up"></i> <span id="likeCount">0</span>
                        </button>
                        <button class="btn-action" id="favoriteBtn">
                            <i class="far fa-bookmark"></i> Guardar
                        </button>
                        <button class="btn-action" id="shareBtn">
                            <i class="fas fa-share"></i> Compartir
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/videos.js"></script>
</body>
</html>
